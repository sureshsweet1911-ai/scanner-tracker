
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PM85 Scanner Tracker - UMA7</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 1.5em;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header p { color: #8892b0; font-size: 0.9em; margin-top: 5px; }
        .container {
            width: 100%;
            max-width: 400px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .step { display: none; animation: fadeIn 0.3s ease; }
        .step.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Shift Buttons */
        .shift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .shift-btn {
            padding: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .shift-btn:hover, .shift-btn:active {
            border-color: #00d2ff;
            background: rgba(0,210,255,0.1);
            transform: scale(1.02);
        }
        .shift-btn .time { font-size: 0.6em; color: #8892b0; margin-top: 5px; display: block; }

        /* Action Buttons */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }
        .action-btn {
            padding: 25px 15px;
            border: none;
            border-radius: 15px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .action-btn:active { transform: scale(0.95); }
        .btn-take { background: linear-gradient(135deg, #00b09b, #96c93d); color: #fff; }
        .btn-return { background: linear-gradient(135deg, #fc5c7d, #6a82fb); color: #fff; }
        .btn-swap {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #1a1a2e;
        }
        .action-btn .icon { font-size: 2em; display: block; margin-bottom: 5px; }

        /* Scanner */
        .scan-area {
            margin-top: 20px;
            text-align: center;
        }
        .scan-label {
            font-size: 1em;
            color: #00d2ff;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .camera-box {
            width: 100%;
            height: 200px;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 2px solid #00d2ff;
        }
        .camera-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .scan-line {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 2px;
            background: #00ff00;
            animation: scanMove 2s infinite;
        }
        @keyframes scanMove { 0%,100% { top: 30%; } 50% { top: 70%; } }
        .scanned-value {
            margin-top: 10px;
            padding: 10px;
            background: rgba(0,210,255,0.1);
            border-radius: 10px;
            font-size: 1.2em;
            color: #00ff00;
            font-weight: bold;
        }
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
        }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        .dot.active { background: #00d2ff; transform: scale(1.3); }
        .dot.done { background: #00ff00; }

        /* Success */
        .success-box {
            text-align: center;
            padding: 30px;
        }
        .success-box .check { font-size: 4em; }
        .success-box h2 { color: #00ff00; margin: 15px 0; }
        .success-box p { color: #8892b0; }
        .success-details {
            margin-top: 15px;
            text-align: left;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 10px;
        }
        .success-details div {
            padding: 5px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9em;
        }
        .success-details span { color: #00d2ff; }
        .back-btn {
            margin-top: 20px;
            padding: 12px 30px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 1em;
            cursor: pointer;
        }
        .status-bar {
            margin-top: 10px;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.85em;
            display: none;
        }
        .status-bar.error { display: block; background: rgba(255,0,0,0.2); color: #ff6b6b; }
        .status-bar.saving { display: block; background: rgba(0,210,255,0.2); color: #00d2ff; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📱 PM85 Scanner Tracker</h1>
        <p>UMA7 — Scan to Check-out / Return</p>
    </div>

    <div class="container">
        <div class="step-indicator">
            <div class="dot active" id="dot1"></div>
            <div class="dot" id="dot2"></div>
            <div class="dot" id="dot3"></div>
            <div class="dot" id="dot4"></div>
        </div>

        <!-- Step 1: Select Shift -->
        <div class="step active" id="step1">
            <h3 style="text-align:center; color:#8892b0;">Select Your Shift</h3>
            <div class="shift-grid">
                <button class="shift-btn" onclick="selectShift('A')">A<span class="time">07:00–17:00</span></button>
                <button class="shift-btn" onclick="selectShift('G')">G<span class="time">09:00–19:00</span></button>
                <button class="shift-btn" onclick="selectShift('B')">B<span class="time">11:00–21:00</span></button>
                <button class="shift-btn" onclick="selectShift('C')">C<span class="time">21:00–07:00</span></button>
            </div>
        </div>

        <!-- Step 2: Select Action -->
        <div class="step" id="step2">
            <h3 style="text-align:center; color:#8892b0;">What do you want to do?</h3>
            <div class="action-grid">
                <button class="action-btn btn-take" onclick="selectAction('TAKE')">
                    <span class="icon">📤</span>TAKE
                </button>
                <button class="action-btn btn-return" onclick="selectAction('RETURN')">
                    <span class="icon">📥</span>RETURN
                </button>
                <button class="action-btn btn-swap" onclick="selectAction('SWAP')">
                    <span class="icon">🔄</span>SWAP DEVICE
                </button>
            </div>
        </div>

        <!-- Step 3: Scan ID Card -->
        <div class="step" id="step3">
            <div class="scan-area">
                <div class="scan-label">📷 Scan Your ID Card Barcode</div>
                <div class="camera-box">
                    <video id="video-id" autoplay playsinline></video>
                    <div class="scan-line"></div>
                </div>
                <div class="scanned-value" id="id-value" style="display:none;"></div>
            </div>
        </div>

        <!-- Step 4: Scan Scanner Barcode -->
        <div class="step" id="step4">
            <div class="scan-area">
                <div class="scan-label" id="scanner-label">📷 Scan Scanner Barcode (PM85-XXX)</div>
                <div class="camera-box">
                    <video id="video-scanner" autoplay playsinline></video>
                    <div class="scan-line"></div>
                </div>
                <div class="scanned-value" id="scanner-value" style="display:none;"></div>
            </div>
        </div>

        <!-- Step 4b: Scan NEW Scanner (for SWAP only) -->
        <div class="step" id="step4b">
            <div class="scan-area">
                <div class="scan-label">📷 Now Scan NEW Scanner Barcode</div>
                <div class="camera-box">
                    <video id="video-new-scanner" autoplay playsinline></video>
                    <div class="scan-line"></div>
                </div>
                <div class="scanned-value" id="new-scanner-value" style="display:none;"></div>
            </div>
        </div>

        <!-- Step 5: Success -->
        <div class="step" id="step5">
            <div class="success-box">
                <div class="check">✅</div>
                <h2 id="success-title">Logged Successfully!</h2>
                <div class="success-details" id="success-details"></div>
                <button class="back-btn" onclick="resetForm()">Done — New Scan</button>
            </div>
        </div>

        <div class="status-bar" id="status-bar"></div>
    </div>

    <!-- Quagga.js for barcode scanning -->
    <script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
    <script>
        // ===== CONFIGURATION =====
        var CONFIG = {
            QUIP_TOKEN: 'YOUR_QUIP_TOKEN_HERE', // Replace with your token (keep secret!)
            QUIP_DOC_ID: 'dhUCA4htEONI',
            SITE: 'UMA7',
            SHIFTS: {
                'A': { start: '07:00', end: '17:00' },
                'G': { start: '09:00', end: '19:00' },
                'B': { start: '11:00', end: '21:00' },
                'C': { start: '21:00', end: '07:00' }
            }
        };

        // ===== STATE =====
        var state = {
            shift: '',
            action: '',
            associateId: '',
            scannerId: '',
            newScannerId: '',
            timestamp: ''
        };

        // ===== STEP NAVIGATION =====
        function showStep(num) {
            document.querySelectorAll('.step').forEach(function(s) { s.classList.remove('active'); });
            document.getElementById('step' + num).classList.add('active');
            document.querySelectorAll('.dot').forEach(function(d, i) {
                d.classList.remove('active', 'done');
                if (i < num - 1) d.classList.add('done');
                if (i === num - 1) d.classList.add('active');
            });
        }

        // ===== SHIFT SELECTION =====
        function selectShift(shift) {
            state.shift = shift;
            showStep(2);
        }

        // ===== ACTION SELECTION =====
        function selectAction(action) {
            state.action = action;
            showStep(3);
            startScanner('video-id', function(code) {
                state.associateId = code;
                document.getElementById('id-value').textContent = '✅ ID: ' + code;
                document.getElementById('id-value').style.display = 'block';
                stopScanner();
                setTimeout(function() {
                    showStep(4);
                    if (action === 'SWAP') {
                        document.getElementById('scanner-label').textContent = '📷 Scan OLD Scanner Barcode (returning)';
                    }
                    startScanner('video-scanner', function(code2) {
                        state.scannerId = code2;
                        document.getElementById('scanner-value').textContent = '✅ Scanner: ' + code2;
                        document.getElementById('scanner-value').style.display = 'block';
                        stopScanner();
                        if (action === 'SWAP') {
                            setTimeout(function() {
                                showStep('4b');
                                document.getElementById('step4b').classList.add('active');
                                startScanner('video-new-scanner', function(code3) {
                                    state.newScannerId = code3;
                                    document.getElementById('new-scanner-value').textContent = '✅ New Scanner: ' + code3;
                                    document.getElementById('new-scanner-value').style.display = 'block';
                                    stopScanner();
                                    setTimeout(submitData, 500);
                                });
                            }, 800);
                        } else {
                            setTimeout(submitData, 500);
                        }
                    });
                }, 800);
            });
        }

        // ===== BARCODE SCANNER =====
        var quaggaRunning = false;

        function startScanner(videoId, callback) {
            var videoEl = document.getElementById(videoId);
            Quagga.init({
                inputStream: {
                    name: "Live",
                    type: "LiveStream",
                    target: videoEl.parentElement,
                    constraints: {
                        facingMode: "environment",
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                },
                decoder: {
                    readers: ["code_128_reader"]
                },
                locate: true
            }, function(err) {
                if (err) {
                    showStatus('Camera error: ' + err.message, 'error');
                    return;
                }
                Quagga.start();
                quaggaRunning = true;
            });

            Quagga.onDetected(function(result) {
                if (result && result.codeResult && result.codeResult.code) {
                    var code = result.codeResult.code;
                    // Vibrate phone for feedback
                    if (navigator.vibrate) navigator.vibrate(200);
                    callback(code);
                }
            });
        }

        function stopScanner() {
            if (quaggaRunning) {
                Quagga.stop();
                Quagga.offDetected();
                quaggaRunning = false;
            }
        }

        // ===== SUBMIT DATA TO QUIP =====
        function submitData() {
            state.timestamp = new Date().toLocaleString('en-IN', { timeZone: 'Asia/Kolkata' });
            showStatus('Saving...', 'saving');

            var rows = [];
            if (state.action === 'SWAP') {
                // Log return of old scanner + take of new scanner
                rows.push([state.timestamp, state.shift, state.associateId, state.scannerId, 'RETURN', CONFIG.SITE].join(' | '));
                rows.push([state.timestamp, state.shift, state.associateId, state.newScannerId, 'TAKE', CONFIG.SITE].join(' | '));
            } else {
                rows.push([state.timestamp, state.shift, state.associateId, state.scannerId, state.action, CONFIG.SITE].join(' | '));
            }

            // Write to Quip
            var content = rows.join('\n');
            writeToQuip(content, function(success) {
                if (success) {
                    showSuccess();
                } else {
                    showStatus('Save failed — data stored locally. Will retry.', 'error');
                    saveLocally(rows);
                    setTimeout(showSuccess, 1500);
                }
            });
        }

        function writeToQuip(content, callback) {
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://platform.quip-amazon.com/1/threads/' + CONFIG.QUIP_DOC_ID + '/messages', true);
            xhr.setRequestHeader('Authorization', 'Bearer ' + CONFIG.QUIP_TOKEN);
            xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
            xhr.onload = function() {
                callback(xhr.status === 200 || xhr.status === 201);
            };
            xhr.onerror = function() { callback(false); };
            xhr.send('content=' + encodeURIComponent(content));
        }

        function saveLocally(rows) {
            var saved = JSON.parse(localStorage.getItem('pm85_offline') || '[]');
            saved = saved.concat(rows);
            localStorage.setItem('pm85_offline', JSON.stringify(saved));
        }

        // ===== SUCCESS SCREEN =====
        function showSuccess() {
            hideStatus();
            var details = '<div><span>Time:</span> ' + state.timestamp + '</div>' +
                '<div><span>Shift:</span> ' + state.shift + '</div>' +
                '<div><span>Associate:</span> ' + state.associateId + '</div>' +
                '<div><span>Scanner:</span> ' + state.scannerId + '</div>' +
                '<div><span>Action:</span> ' + state.action + '</div>';
            if (state.action === 'SWAP') {
                details += '<div><span>New Scanner:</span> ' + state.newScannerId + '</div>';
            }
            document.getElementById('success-details').innerHTML = details;
            document.getElementById('success-title').textContent =
                state.action === 'TAKE' ? '✅ Scanner Assigned!' :
                state.action === 'RETURN' ? '✅ Scanner Returned!' :
                '✅ Scanner Swapped!';
            showStep(5);
        }

        // ===== RESET =====
        function resetForm() {
            state = { shift: '', action: '', associateId: '', scannerId: '', newScannerId: '', timestamp: '' };
            document.getElementById('id-value').style.display = 'none';
            document.getElementById('scanner-value').style.display = 'none';
            document.getElementById('new-scanner-value').style.display = 'none';
            document.getElementById('scanner-label').textContent = '📷 Scan Scanner Barcode (PM85-XXX)';
            showStep(1);
        }

        // ===== STATUS =====
        function showStatus(msg, type) {
            var bar = document.getElementById('status-bar');
            bar.textContent = msg;
            bar.className = 'status-bar ' + type;
        }
        function hideStatus() {
            document.getElementById('status-bar').className = 'status-bar';
        }

        // ===== RETRY OFFLINE DATA =====
        function retryOffline() {
            var saved = JSON.parse(localStorage.getItem('pm85_offline') || '[]');
            if (saved.length > 0) {
                writeToQuip(saved.join('\n'), function(success) {
                    if (success) localStorage.removeItem('pm85_offline');
                });
            }
        }
        setInterval(retryOffline, 60000); // retry every 60 sec
    </script>
</body>
</html>
